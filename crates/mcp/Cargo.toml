[package]
name = "oxidezap-mcp"
description = "Native stdio MCP front end for oxidezapd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "oxidezap-mcp"
path = "src/main.rs"

[dependencies]
oxidezap-ipc = { workspace = true }
oxidezap-wire = { workspace = true }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-std", "io-util", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
