<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WhatsNative logo: an angular W cut from cyan and violet shards on an indigo tile">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a33"/>
      <stop offset="1" stop-color="#0a0e1f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6d6"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67f5e4"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#b07cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#tile)"/>
  <rect x="31" y="31" width="450" height="450" rx="111" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <rect x="52" y="52" width="408" height="408" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <path d="M 128 148 L 196 356 L 256 226 L 316 356 L 384 148"
        fill="none" stroke="url(#mark)" stroke-opacity="0.45" stroke-width="52"
        stroke-linejoin="miter" stroke-linecap="butt" filter="url(#glow)"/>
  <path d="M 128 148 L 196 356 L 256 226 L 316 356 L 384 148"
        fill="none" stroke="url(#mark)" stroke-width="44"
        stroke-linejoin="miter" stroke-linecap="butt"/>
  <path d="M 128 140 L 196 348 L 256 218 L 316 348 L 384 140"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8"
        stroke-linejoin="miter" stroke-linecap="butt"/>
</svg>
