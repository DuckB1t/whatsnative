<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="WhatsNative — a native WhatsApp client built with Rust and GPUI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1418"/>
      <stop offset="0.55" stop-color="#0f2027"/>
      <stop offset="1" stop-color="#0b171c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#00a884" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#00a884" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06cf9c"/>
      <stop offset="1" stop-color="#53bdeb"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- stylised conversation, right side -->
  <g transform="translate(845 52)">
    <rect x="34" y="8" width="230" height="70" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="62" cy="43" r="13" fill="#06cf9c" fill-opacity="0.55"/>
    <rect x="86" y="32" width="120" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.32"/>
    <rect x="86" y="47" width="82" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>

    <path d="M6 104h196a18 18 0 0 1 18 18v46a18 18 0 0 1-18 18H64l-24 20v-20a18 18 0 0 1-18-18v-46a18 18 0 0 1 18-18z" fill="url(#accent)" fill-opacity="0.92"/>
    <rect x="26" y="130" width="128" height="8" rx="4" fill="#06251f" fill-opacity="0.62"/>
    <rect x="26" y="148" width="90" height="7" rx="3.5" fill="#06251f" fill-opacity="0.38"/>

    <rect x="150" y="212" width="170" height="62" rx="18" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="170" y="232" width="106" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="170" y="248" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(72 118)">
    <text x="0" y="58" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#f4fbf9">Whats<tspan fill="#06cf9c">Native</tspan></text>
    <rect x="2" y="82" width="86" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="126" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" letter-spacing="0.3" fill="#a9c4bf">FUCK ELECTRON. FUCK WEBVIEW.</text>
    <text x="0" y="156" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" letter-spacing="0.3" fill="#6f9690">Rust + GPUI. A real native client.</text>
  </g>

  <text x="72" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.6" fill="#6f9690">A NATIVE WHATSAPP CLIENT FOR LINUX, macOS &amp; WINDOWS</text>
  <circle cx="1120" cy="56" r="4" fill="#06cf9c" filter="url(#soft)"/>
</svg>
